name: Run AccessAudit v2.2 patch

on:
  push:
    branches:
      - feat/access-audit-v2.2
    paths:
      - '.github/accessaudit-v2.2/trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/access-audit-v2.2
          fetch-depth: 0

      - name: Decode patch package
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/accessaudit-v2.2/package.b64 > /tmp/accessaudit-v2.2.zip
          rm -rf /tmp/accessaudit-v2.2
          mkdir -p /tmp/accessaudit-v2.2
          unzip -q /tmp/accessaudit-v2.2.zip -d /tmp/accessaudit-v2.2

      - name: Apply v2.2 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/accessaudit-v2.2/accessaudit-v2.2/apply_access_audit_v2_2.py "$GITHUB_WORKSPACE"

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l panel-plugin/AccessAudit/Http/Controllers/AdminController.php
          php -l panel-plugin/AccessAudit/Plugin.php
          php -l panel-plugin/AccessAudit/routes/web.php
          php -l panel-plugin/AccessAudit/Services/AnalyticsService.php
          php -l panel-plugin/AccessAudit/database/migrations/2026_09_17_000005_create_audit_analytics_tables.php

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .accessaudit-v2.2-backup .accessaudit-v2.2-backup-* || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panel-plugin/AccessAudit
          git commit -m 'feat(access-audit): add analytics and plugin settings'
          git push origin HEAD:feat/access-audit-v2.2
