name: Apply standalone TX-Node migration

on:
  push:
    branches: [refactor/standalone-tx-node-clean]
    paths:
      - '.github/standalone-clean.trigger'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/standalone-tx-node-clean
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply standalone migration
        run: python3 .github/scripts/apply-standalone-clean.py

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          git diff --check
          ! grep -R --line-number --fixed-strings 'github.com/cedar2025/xboard-node/' cmd internal go.mod
          ! grep -R --line-number --fixed-strings 'txctl' Makefile .github/workflows/ci.yml docs/standalone.md

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod cmd internal Makefile Dockerfile .github/workflows/ci.yml README.md docs/standalone.md
          git commit -m 'refactor: establish TX-Node standalone identity'
          git push origin HEAD:refactor/standalone-tx-node-clean
