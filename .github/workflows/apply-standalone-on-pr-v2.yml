name: Apply standalone TX-Node migration on PR v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    if: github.head_ref == 'refactor/standalone-tx-node-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/standalone-tx-node-clean
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply standalone migration
        run: python3 .github/scripts/apply-standalone-clean-v2.py

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          git diff --check
          ! grep -R --line-number --fixed-strings 'github.com/cedar2025/xboard-node/' cmd internal go.mod
          ! grep -R --line-number --fixed-strings 'txctl' Makefile .github/workflows/ci.yml docs/standalone.md

      - name: Remove all one-shot migration helpers
        shell: bash
        run: |
          rm -f \
            .github/scripts/apply-standalone-clean.py \
            .github/scripts/apply-standalone-clean-v2.py \
            .github/standalone-clean.trigger \
            .github/workflows/apply-standalone-clean.yml \
            .github/workflows/apply-standalone-on-pr.yml \
            .github/workflows/apply-standalone-on-pr-v2.yml

      - name: Commit standalone migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: establish TX-Node standalone identity'
          git push origin HEAD:refactor/standalone-tx-node-clean
