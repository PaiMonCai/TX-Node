name: Temporary module checksum

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-target-ip
      - name: Commit verified sing-box checksums
        run: |
          if grep -Fq 'github.com/PaiMonCai/sing-box v1.14.0-alpha.2.0.20260917151157-106bcaf15fd3 h1:k2o/VSzYcK1TUK3jTP6D28MMfcDDFXpYdQqugSdiPt4=' go.sum; then
            echo 'checksum already present'
            exit 0
          fi
          printf '%s\n' \
            'github.com/PaiMonCai/sing-box v1.14.0-alpha.2.0.20260917151157-106bcaf15fd3 h1:k2o/VSzYcK1TUK3jTP6D28MMfcDDFXpYdQqugSdiPt4=' \
            'github.com/PaiMonCai/sing-box v1.14.0-alpha.2.0.20260917151157-106bcaf15fd3/go.mod h1:DTyWqWrjh/DqOHynCUgMhW8fgrkctleficRKwQmh668=' >> go.sum
          sort -u go.sum -o go.sum
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.sum
          git commit -m 'Update sing-box module checksum'
          git push origin HEAD:fix/audit-target-ip
