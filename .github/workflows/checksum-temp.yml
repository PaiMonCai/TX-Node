name: Temporary module checksum

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve and print sing-box checksum
        run: go mod download -json github.com/PaiMonCai/sing-box@v1.14.0-alpha.2.0.20260917151157-106bcaf15fd3
