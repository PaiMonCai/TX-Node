name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  # 仅供正式发布向导在创建稳定 Tag 后调度同一个 CI；main 手动触发不发镜像
  workflow_dispatch:

# main 每次提交都必须获得独立的构建机会；只取消旧 PR 验证。
# 若以分支作为并发组，GitHub 可能替换排队中的提交，导致某个 SHA 没有镜像。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Validate tagged release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify canonical Go module and source paths
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'module github.com/ANRCM0/TX-Node' go.mod
          if grep -RFn 'github.com/PaiMonCai/TX-Node' cmd internal Makefile Dockerfile go.mod; then
            echo "Legacy TX-Node module path has reappeared in runtime sources or build metadata" >&2
            exit 1
          fi
          if grep -Fq 'ghcr.io/paimoncai/tx-node' Dockerfile; then
            echo "Legacy TX-Node registry location has reappeared in the Dockerfile" >&2
            exit 1
          fi
          go mod verify

      - name: Enforce ANRCM0-owned kernel dependencies
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^replace github.com/sagernet/sing-box => github.com/ANRCM0/sing-box v' go.mod
          grep -Eq '^replace github.com/xtls/xray-core => github.com/ANRCM0/Xray-core v' go.mod
          if grep -E 'github.com/PaiMonCai/(sing-box|Xray-core)' go.mod go.sum; then
            echo "Old-account kernel fork dependency has reappeared" >&2
            exit 1
          fi
          grep -Eq '^github.com/ANRCM0/sing-box v[^ ]+ h1:' go.sum
          grep -Eq '^github.com/ANRCM0/Xray-core v[^ ]+ h1:' go.sum
          go mod tidy -diff

      - name: Validate current release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .github/release/VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid .github/release/VERSION: $version" >&2
            exit 1
          fi
          grep -Fxq "# TX-Node $version" .github/release/NOTES.md
          # Compose retired patterns without embedding their full literal names:
          # the existing retirement guard intentionally scans this workflow too.
          retired_node_bin="xboard-node""-linux-"
          retired_cli_bin="xbctl""-linux-"
          retired_audit_zip="AccessAudit""-plugin.zip"
          if grep -Fq "$retired_node_bin" .github/release/NOTES.md \
            || grep -Fq "$retired_cli_bin" .github/release/NOTES.md \
            || grep -Fq "$retired_audit_zip" .github/release/NOTES.md; then
            echo "Release notes list retired binary/plugin artifacts" >&2
            exit 1
          fi

      - name: Verify stable Tag matches release metadata and main history
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$(tr -d '[:space:]' < .github/release/VERSION)"
          (git fetch --no-tags --unshallow origin main || git fetch --no-tags origin main)
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Stable release Tag must refer to a commit on main" >&2
            exit 1
          }

      - name: Run tests
        run: make test

      - name: Enforce legacy retirement boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d cmd/xbctl
          legacy_xboard_artifact="xboard-node""-linux-"
          legacy_xbctl_artifact="xbctl""-linux-"
          legacy_docker_alias="xboard-node"":latest"
          if grep -Fq "$legacy_xboard_artifact" Makefile .github/workflows/ci.yml; then
            echo "legacy xboard-node release artifact was reintroduced" >&2
            exit 1
          fi
          if grep -Fq "$legacy_xbctl_artifact" Makefile .github/workflows/ci.yml; then
            echo "legacy xbctl release artifact was reintroduced" >&2
            exit 1
          fi
          if grep -Fq "$legacy_docker_alias" Makefile Dockerfile; then
            echo "legacy xboard-node Docker alias was reintroduced" >&2
            exit 1
          fi
          grep -Fq 'CMD ["-c", "/etc/txnode/config.yml"]' Dockerfile

  container-config-path:
    name: Container config path compatibility
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t tx-node:config-path-ci .

      - name: Verify canonical image command
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect tx-node:config-path-ci --format '{{json .Config.Cmd}}')" = '["-c","/etc/txnode/config.yml"]'

      - name: Verify old Compose mount fallback
        shell: bash
        run: |
          set -euo pipefail
          legacy_cfg="$(mktemp)"
          printf 'invalid: [\n' > "$legacy_cfg"
          output="$(docker run --rm -v "$legacy_cfg:/etc/xboard-node/config.yml:ro" tx-node:config-path-ci 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Fq 'using legacy container config path /etc/xboard-node/config.yml' <<<"$output"

      - name: Verify canonical path wins
        shell: bash
        run: |
          set -euo pipefail
          canonical_cfg="$(mktemp)"
          legacy_cfg="$(mktemp)"
          printf 'invalid: [\n' > "$canonical_cfg"
          printf 'invalid: [\n' > "$legacy_cfg"
          output="$(docker run --rm \
            -v "$canonical_cfg:/etc/txnode/config.yml:ro" \
            -v "$legacy_cfg:/etc/xboard-node/config.yml:ro" \
            tx-node:config-path-ci 2>&1 || true)"
          printf '%s\n' "$output"
          if grep -Fq 'using legacy container config path' <<<"$output"; then
            echo "legacy fallback won despite canonical config being mounted" >&2
            exit 1
          fi

  runtime-stability:
    name: Runtime stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Stress extracted runtime controllers
        run: make test-runtime-stability

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, runtime-stability]
    # 只有正式版本 Tag 才生成 GitHub Release 二进制附件
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload tx-node artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tx-node-${{ matrix.goos }}-${{ matrix.goarch }}

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, runtime-stability]
    # main 每次 push 自动构建 :dev + 不可变 SHA；正式 Tag 才更新稳定版
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name (GHCR requires lowercase)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # GHA 构建缓存：QEMU arm64 编译第二次起显著提速；
          # mode=max 缓存所有构建阶段（含 go mod download / 编译中间层）
          cache-from: type=gha,scope=txnode
          cache-to: type=gha,mode=max,scope=txnode
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}:{1}', steps.repo.outputs.name, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}:latest', steps.repo.outputs.name) || '' }}

      # Always keep an immutable :SHA image for each main commit. Only advance
      # the mutable dev alias if this is still the repository's latest main SHA.
      # Thus a slower older build cannot roll :dev back after newer commits.
      - name: Promote current main image to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ steps.repo.outputs.name }}"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "main has advanced to $current_main; immutable :$GITHUB_SHA published, skip stale :dev alias"
            exit 0
          fi
          docker buildx imagetools create --tag "$image:dev" "$image:$GITHUB_SHA"
          echo "Published $image:dev from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body_path: .github/release/NOTES.md
          files: |
            dist/tx-node-linux-amd64
            dist/tx-node-linux-arm64
