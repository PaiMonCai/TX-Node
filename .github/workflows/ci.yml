name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  # 手动触发仅用于验证构建/镜像；正式 Release 只由 v* tag 产生。
  workflow_dispatch:
    inputs:
      push_latest:
        description: '同时更新 latest 镜像标签'
        type: boolean
        default: true

# 同一分支的连续 push 自动取消过期的 run，只跑最新提交
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    # 仅手动触发或打 tag 才构建二进制（普通 push 只跑 test）
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload tx-node artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tx-node-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload txctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: txctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: txctl-${{ matrix.goos }}-${{ matrix.goarch }}

      # Legacy filenames are kept for one compatibility window so existing
      # automation can migrate without an abrupt break.
      - name: Upload xboard-node compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload xbctl compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # 仅手动触发或打 tag 才推镜像
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name (GHCR requires lowercase)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=txnode
          cache-to: type=gha,mode=max,scope=txnode
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && github.event.inputs.push_latest == 'true') && format('ghcr.io/{0}:latest', steps.repo.outputs.name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', steps.repo.outputs.name, github.ref_name) || '' }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    # Release 必须来自真实语义版本标签，禁止再创建名为 main 的 Release。
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Package AccessAudit panel plugin
        run: |
          cd panel-plugin
          zip -r "$GITHUB_WORKSPACE/dist/AccessAudit-plugin.zip" AccessAudit
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/tx-node-linux-amd64
            dist/tx-node-linux-arm64
            dist/txctl-linux-amd64
            dist/txctl-linux-arm64
            dist/xboard-node-linux-amd64
            dist/xboard-node-linux-arm64
            dist/xbctl-linux-amd64
            dist/xbctl-linux-arm64
            dist/AccessAudit-plugin.zip
