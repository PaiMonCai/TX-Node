name: Temporary target IP diff cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-target-ip
          fetch-depth: 0
      - name: Restore base formatting and apply minimal target_ip patch
        run: |
          git fetch origin fix/source-ip-proxy-protocol
          git show origin/fix/source-ip-proxy-protocol:go.sum > go.sum
          git show origin/fix/source-ip-proxy-protocol:panel-plugin/AccessAudit/Http/Controllers/ReportController.php > panel-plugin/AccessAudit/Http/Controllers/ReportController.php
          python3 - <<'PY'
          from pathlib import Path

          version = b'v1.14.0-alpha.2.0.20260917151157-106bcaf15fd3'
          module_sum = b'h1:k2o/VSzYcK1TUK3jTP6D28MMfcDDFXpYdQqugSdiPt4='
          gomod_sum = b'h1:DTyWqWrjh/DqOHynCUgMhW8fgrkctleficRKwQmh668='

          p = Path('go.sum')
          data = p.read_bytes()
          nl = b'\r\n' if b'\r\n' in data else b'\n'
          old_anchor = b'github.com/PaiMonCai/sing-box v1.14.0-alpha.2.0.20260917144113-eece7143139b/go.mod h1:DTyWqWrjh/DqOHynCUgMhW8fgrkctleficRKwQmh668=' + nl
          assert data.count(old_anchor) == 1
          new_lines = (
              b'github.com/PaiMonCai/sing-box ' + version + b' ' + module_sum + nl +
              b'github.com/PaiMonCai/sing-box ' + version + b'/go.mod ' + gomod_sum + nl
          )
          data = data.replace(old_anchor, old_anchor + new_lines, 1)
          p.write_bytes(data)

          p = Path('panel-plugin/AccessAudit/Http/Controllers/ReportController.php')
          data = p.read_bytes()
          nl = b'\r\n' if b'\r\n' in data else b'\n'

          old = b'     {"user_id": 123, "target": "example.com", "source_ip": "1.2.3.4", "matched": true},'
          new = b'     {"user_id": 123, "target": "example.com", "target_ip": "93.184.216.34", "source_ip": "1.2.3.4", "matched": true},'
          assert data.count(old) == 1
          data = data.replace(old, new, 1)

          old = b"            'events.*.target' => 'required|string|max:255'," + nl + b"            'events.*.source_ip' => 'nullable|string|max:45',"
          new = b"            'events.*.target' => 'required|string|max:255'," + nl + b"            'events.*.target_ip' => 'nullable|string|max:45'," + nl + b"            'events.*.source_ip' => 'nullable|string|max:45',"
          assert data.count(old) == 1
          data = data.replace(old, new, 1)

          old = b"                'target' => mb_substr((string) $event['target'], 0, 255)," + nl + b"                'source_ip' => isset($event['source_ip']) ? mb_substr((string) $event['source_ip'], 0, 45) : null,"
          new = b"                'target' => mb_substr((string) $event['target'], 0, 255)," + nl + b"                'target_ip' => isset($event['target_ip']) ? mb_substr((string) $event['target_ip'], 0, 45) : null," + nl + b"                'source_ip' => isset($event['source_ip']) ? mb_substr((string) $event['source_ip'], 0, 45) : null,"
          assert data.count(old) == 2
          data = data.replace(old, new)
          p.write_bytes(data)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.sum panel-plugin/AccessAudit/Http/Controllers/ReportController.php
          if git diff --cached --quiet; then
            echo 'already clean'
            exit 0
          fi
          git commit -m 'Clean target IP dependency and panel diff'
          git push origin HEAD:fix/audit-target-ip
