name: Finalize standalone TX-Node

on:
  pull_request:
    types: [edited]
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: github.head_ref == 'refactor/standalone-tx-node-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/standalone-tx-node-clean
          fetch-depth: 0

      - name: Apply final review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) README: restore license/disclaimer without disturbing deployment docs.
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          if '## License' not in s:
              s = s.rstrip() + '\n\n## License\n\nMPL-2.0。项目保留其历史来源及适用的上游版权与许可证声明。\n\n> **Disclaimer**: This project is for educational and learning purposes only.\n'
          p.write_text(s, encoding='utf-8')

          # 2) Makefile: canonical local Docker latest tag plus legacy compatibility tag.
          p = Path('Makefile')
          s = p.read_text(encoding='utf-8')
          old = 'docker build -t tx-node:$(VERSION) -t xboard-node:latest .'
          new = 'docker build -t tx-node:$(VERSION) -t tx-node:latest -t xboard-node:latest .'
          if old not in s and new not in s:
              raise SystemExit('expected docker target not found in Makefile')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) standalone policy: xbctl still models legacy service layout, but downloads TX-Node releases.
          p = Path('docs/standalone.md')
          s = p.read_text(encoding='utf-8')
          old = '`xbctl` is intentionally **not** renamed to `txctl` yet. Its upgrade/service logic still models the legacy systemd installation, so presenting it as a new TX-Node CLI would be misleading and could pull binaries from the old upstream path.'
          new = '`xbctl` is intentionally **not** renamed to `txctl` yet. Its service/configuration model still targets the legacy systemd installation layout, while its release download source now points to `PaiMonCai/TX-Node`. A future `txctl` should be introduced only after the management CLI is redesigned around the current TX-Node deployment model.'
          if old not in s and new not in s:
              raise SystemExit('expected xbctl policy paragraph not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          git diff --check
          grep -q '^## License$' README.md
          grep -q 'tx-node:latest' Makefile
          grep -q 'PaiMonCai/TX-Node' docs/standalone.md

      - name: Commit final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Makefile docs/standalone.md
          if git diff --cached --quiet; then
            echo 'No final fixes needed.'
            exit 0
          fi
          git commit -m 'docs: finalize standalone compatibility notes'
          git push origin HEAD:refactor/standalone-tx-node-clean
