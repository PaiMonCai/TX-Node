name: Migrate Xray fork ownership

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'upgrade/xray-core-2026q3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Switch Xray fork owner
        run: |
          sed -i 's#github.com/cedar2025/Xray-core#github.com/PaiMonCai/Xray-core#' go.mod
          grep -F 'replace github.com/xtls/xray-core => github.com/PaiMonCai/Xray-core v0.0.0-20260409213332-f47935539965' go.mod
      - name: Refresh module checksums
        env:
          GOPROXY: https://proxy.golang.org,direct
          GONOPROXY: github.com/PaiMonCai/Xray-core
          GONOSUMDB: github.com/PaiMonCai/Xray-core
        run: go mod tidy
      - name: Test
        env:
          GOPROXY: https://proxy.golang.org,direct
          GONOPROXY: github.com/PaiMonCai/Xray-core
          GONOSUMDB: github.com/PaiMonCai/Xray-core
        run: go test ./...
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'chore: move Xray fork under PaiMonCai'
          git push origin HEAD:${{ github.head_ref }}
