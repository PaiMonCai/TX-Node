name: Publish semantic release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-release.yml'
      - '.github/release/VERSION'
      - '.github/release/NOTES.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    name: Publish versioned release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '[:space:]' < .github/release/VERSION)"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated version tag
        if: steps.state.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m "TX-Node $TAG"
          git push origin "$TAG"

      # Tag pushes created by GITHUB_TOKEN do not recursively start workflows.
      # Explicitly dispatch the existing ci.yml at the tag so the repository's
      # normal binary/Docker/plugin packaging remains the single build path.
      - name: Dispatch existing release CI
        if: steps.state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$TAG" -f push_latest=true

      - name: Wait for release CI
        if: steps.state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list \
              --workflow ci.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headBranch,headSha \
              --jq ".[] | select(.headBranch == \"$TAG\" and .headSha == \"$GITHUB_SHA\") | .databaseId" \
              | head -n1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$RUN_ID" ]; then
            echo "Unable to find dispatched ci.yml run for $TAG" >&2
            exit 1
          fi

          echo "Watching release CI run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Apply release title and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          gh release view "$TAG" >/dev/null
          gh release edit "$TAG" \
            --title "TX-Node $TAG" \
            --notes-file .github/release/NOTES.md

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
