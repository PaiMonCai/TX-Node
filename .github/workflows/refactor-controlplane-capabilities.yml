name: Refactor control-plane capabilities

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'refactor/controlplane-capabilities'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Decouple audit reporter from panel config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/service/service.go')
          text = path.read_text()
          start_marker = '\tif cfg.Audit.Enabled {\n'
          end_marker = '\n\treturn &Service{'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''\tif cfg.Audit.Enabled {
          \t\tif sb, ok := k.(*singbox.SingBox); ok {
          \t\t\ttarget, targetOK := controlplane.AuditTargetOf(cp)
          \t\t\tif !targetOK {
          \t\t\t\tnlog.Core().Warn("audit enabled but control plane does not expose audit target")
          \t\t\t} else {
          \t\t\t\tsb.SetAuditor(audit.New(audit.Config{
          \t\t\t\t\tEnabled:       cfg.Audit.Enabled,
          \t\t\t\t\tReportAll:     cfg.Audit.ReportAll,
          \t\t\t\t\tBatchMax:      cfg.Audit.BatchMax,
          \t\t\t\t\tFlushInterval: cfg.Audit.FlushInterval,
          \t\t\t\t\tRulesRefresh:  cfg.Audit.RulesRefresh,
          \t\t\t\t\tQueueCap:      cfg.Audit.QueueCap,
          \t\t\t\t}, audit.PanelAuth{
          \t\t\t\t\tBaseURL:   target.BaseURL,
          \t\t\t\t\tToken:     target.Token,
          \t\t\t\t\tNodeID:    target.NodeID,
          \t\t\t\t\tNodeType:  target.NodeType,
          \t\t\t\t\tMachineID: target.MachineID,
          \t\t\t\t}))
          \t\t\t}
          \t\t} else {
          \t\t\tnlog.Core().Warn("audit enabled but kernel is not sing-box, skipping",
          \t\t\t\t"kernel", cfg.Kernel.Type)
          \t\t}
          \t}
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          gofmt -w internal/service/service.go internal/controlplane/capabilities.go internal/controlplane/capabilities_test.go internal/controlplane/factory_test.go internal/panel/identity.go
      - name: Test
        run: go test ./...
      - name: Diff check
        run: git diff --check
      - name: Commit core decoupling
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No service changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/service/service.go internal/controlplane internal/panel/identity.go
          git commit -m 'refactor: decouple audit from panel configuration'
          git push origin HEAD:${{ github.head_ref }}
